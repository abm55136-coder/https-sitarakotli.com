<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#b38f2a" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Outer Luxury Rings -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 6" opacity="0.6" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.8" />
  <circle cx="200" cy="200" r="150" fill="#121217" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Star Embellishment at top -->
  <path d="M 200 70 L 204 84 L 218 84 L 206 93 L 211 107 L 200 98 L 189 107 L 194 93 L 182 84 L 196 84 Z" fill="url(#goldGrad)" />

  <!-- Monogram Initials AM (Awais Malik) -->
  <text x="200" y="215" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="94" font-weight="800" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="4">AM</text>

  <!-- Urdu Signature & Title -->
  <text x="200" y="260" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#fef08a" opacity="0.95">اویس ملک</text>
  <text x="200" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#eab308" letter-spacing="3">AWAIS MALIK</text>
  <text x="200" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#a1a1aa" letter-spacing="2">OWNER &amp; CHIEF EXECUTIVE</text>
  <text x="200" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#d4af37" letter-spacing="1.5">SITARA CLOTH HOUSE • KOTLI</text>
</svg>
